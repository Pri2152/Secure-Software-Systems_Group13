
# SR-07: Electronic Voting Platform
# Local academic demonstration only.
# Not a production gateway configuration.

# SR-19: Request limits (Workstream E, agreed with Workstream A).
# Registered polling terminals are listed by address (not by client
# certificate) and use their own, higher limits, so public traffic
# can never use up their allowance.
geo $evp_registered_terminal {
    default 0;
    # Local demo: the terminal-sim container on the edge network.
    172.30.0.20/32 1;
}

# An empty key is not counted, so each address falls into exactly
# one of the public or terminal zones.
map $evp_registered_terminal $evp_public_key {
    0 $binary_remote_addr;
    1 "";
}

map $evp_registered_terminal $evp_terminal_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $evp_public_key zone=evp_public:10m rate=10r/s;
limit_req_zone $evp_terminal_key zone=evp_terminal:10m rate=50r/s;
limit_req_zone $evp_public_key zone=evp_login:10m rate=5r/m;
limit_req_zone $evp_public_key zone=evp_ballot:10m rate=1r/s;

limit_conn_zone $evp_public_key zone=evp_public_conn:10m;
limit_conn_zone $evp_terminal_key zone=evp_terminal_conn:10m;

# SR-08: ballot requests are logged without the client address
# (no $remote_addr, X-Forwarded-For or User-Agent).
log_format evp_ballot_no_ip '[$time_local] "$request" $status '
                            '$body_bytes_sent $request_time';

# HTTP: deny application access.
server {
    listen 8080 default_server;
    server_name _;

    access_log /var/log/nginx/evp_http_access.log;
    error_log /var/log/nginx/evp_http_error.log warn;

    location = /health {
        default_type text/plain;
        return 200 "EVP Nginx gateway active\n";
    }

    location / {
        return 403;
    }
}

# HTTPS: certificate verification and Flask proxy.
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Verify certificates when clients present them.
    ssl_client_certificate /etc/nginx/certs/test-ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;

    access_log /var/log/nginx/evp_https_access.log;
    error_log /var/log/nginx/evp_https_error.log warn;

    # SR-19: request size, slow-body and connection limits.
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn evp_public_conn 20;
    limit_conn evp_terminal_conn 100;

    # Health check.
    location = /health {
        default_type text/plain;
        return 200 "EVP HTTPS gateway active\n";
    }

    # Test client certificate verification.
    location = /mtls-test {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        default_type text/plain;
        return 200 "EVP client certificate verified\n";
    }

    # SR-19: login is limited to 5 requests per minute per address.
    location = /login {
        limit_req zone=evp_login burst=3 nodelay;
        limit_req zone=evp_terminal burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Overwrite client-provided metadata.
        # Never trust incoming X-EVP-* headers.
        proxy_set_header X-EVP-Source-IP $remote_addr;
        proxy_set_header X-EVP-Client-Verify $ssl_client_verify;
        proxy_set_header X-EVP-Client-Cert $ssl_client_escaped_cert;

        proxy_set_header X-Forwarded-For "";
    }

    # SR-19 / SR-08: ballot requests, stricter limits, no client IP
    # in the access log.
    location /ballot/ {
        limit_req zone=evp_ballot burst=5 nodelay;
        limit_req zone=evp_terminal burst=20 nodelay;

        access_log /var/log/nginx/evp_ballot_access.log evp_ballot_no_ip;

        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Overwrite client-provided metadata.
        # Never trust incoming X-EVP-* headers.
        proxy_set_header X-EVP-Source-IP $remote_addr;
        proxy_set_header X-EVP-Client-Verify $ssl_client_verify;
        proxy_set_header X-EVP-Client-Cert $ssl_client_escaped_cert;

        proxy_set_header X-Forwarded-For "";
    }

    # Forward application requests to Flask.
    location / {
        limit_req zone=evp_public burst=20 nodelay;
        limit_req zone=evp_terminal burst=100 nodelay;

        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Overwrite client-provided metadata.
        # Never trust incoming X-EVP-* headers.
        proxy_set_header X-EVP-Source-IP $remote_addr;
        proxy_set_header X-EVP-Client-Verify $ssl_client_verify;
        proxy_set_header X-EVP-Client-Cert $ssl_client_escaped_cert;

        proxy_set_header X-Forwarded-For "";
    }
}
