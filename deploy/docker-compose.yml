# SR-20: Compartmentalised deployment of the Electronic Voting Platform.
#
# Security controls:
# - Each compartment runs in its own container from deploy/Dockerfile.app
# - Each database has its own container, volume and internal network,
#   so e.g. the ballot service cannot reach the identity database
# - Every network except edge is internal (no outside access)
# - Secrets come from files in deploy/secrets/ (git-ignored), never inline
# - Pinned image versions; app containers run as non-root, read-only,
#   with no Linux capabilities and no privilege escalation
# - restart: unless-stopped and health checks on every app service (SR-19)
#
# TLS is unchanged: the gateway mounts Workstream A's existing Nginx
# configuration and local certificate folder read-only. Workstream E
# does not create or change certificates or TLS settings.
#
# Start (from the repository root):
#   docker compose -f deploy/docker-compose.yml up -d --build
# Services under the "full" profile start only with --profile full.
#
# Local academic prototype.

name: evp

# Shared settings for every Python app container.
x-app-service: &app-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile.app
  image: evp-app:local
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # GET /healthz arrives with SR-19. Until then this check fails and
  # the container shows as unhealthy; it is not restarted for that.
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

# Workstream A voter access, two replicas (SR-19 failover).
x-voter-access: &voter-access
  <<: *app-service
  command:
    - gunicorn
    - --workers
    - "1"
    - --bind
    - 0.0.0.0:5000
    - gateway_runtime:application
  environment:
    EVP_LOCAL_LAB: "1"
  secrets:
    - source: voter_demo_voter
      target: /run/evp/demo-voter.json
    - source: voter_registered_fingerprints
      target: /run/evp/registered_fingerprints.txt
  networks:
    - edge
    - identity_net

services:

  gateway:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    # Bound to this PC only; not reachable from the local network.
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      - voter-access-1
      - voter-access-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  voter-access-1:
    <<: *voter-access

  voter-access-2:
    <<: *voter-access

  # Workstream B: staff authentication, SR-06 and audit reader.
  # Remove the profile when admin/wsgi.py is merged to main.
  admin-audit:
    <<: *app-service
    profiles: ["full"]
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "admin.wsgi:app"]
    networks:
      - edge
      - audit_net
      - identity_net

  # Workstream C: ballot store. Never on identity_net (SR-08, SR-20).
  # Remove the profile when ballot/wsgi.py is merged to main.
  ballot:
    <<: *app-service
    profiles: ["full"]
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "ballot.wsgi:app"]
    networks:
      - edge
      - ballot_net

  # Workstream D: tally and bulletin. Reads ballots, sends results.
  # Remove the profile when verification/wsgi.py is merged to main.
  tally:
    <<: *app-service
    profiles: ["full"]
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "verification.wsgi:app"]
    networks:
      - ballot_net
      - results_net

  # Workstream D: external results receiver.
  # Remove the profile when results_consumer/wsgi.py is merged to main.
  results-consumer:
    <<: *app-service
    profiles: ["full"]
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "results_consumer.wsgi:app"]
    networks:
      - results_net

  # deploy/db/roles.sql is not mounted yet: its ${...} password
  # placeholders must be filled at init time first, or MySQL would
  # store the placeholder text as the password.
  db-identity:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: identity_db
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_identity_root_password
    secrets:
      - db_identity_root_password
    volumes:
      - identity_data:/var/lib/mysql
    networks:
      - identity_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-ballot:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ballot_db
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_ballot_root_password
    secrets:
      - db_ballot_root_password
    volumes:
      - ballot_data:/var/lib/mysql
    networks:
      - ballot_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-audit:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: audit_db
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_audit_root_password
    secrets:
      - db_audit_root_password
    volumes:
      - audit_data:/var/lib/mysql
    networks:
      - audit_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SR-19 placeholder: scheduled 15-minute backups arrive later.
  # For now it prints a notice and exits.
  backup:
    image: mysql:8.4.11
    restart: "no"
    command: ["sh", "-c", "echo 'SR-19 backup service not implemented yet'"]
    volumes:
      - backups:/backups
    networks:
      - identity_net
      - ballot_net
      - audit_net

networks:
  edge: {}
  identity_net:
    internal: true
  ballot_net:
    internal: true
  audit_net:
    internal: true
  results_net:
    internal: true

volumes:
  identity_data: {}
  ballot_data: {}
  audit_data: {}
  backups: {}

# Files are created locally and are git-ignored (deploy/secrets/).
secrets:
  db_identity_root_password:
    file: ./secrets/db_identity_root_password
  db_ballot_root_password:
    file: ./secrets/db_ballot_root_password
  db_audit_root_password:
    file: ./secrets/db_audit_root_password
  voter_demo_voter:
    file: ./secrets/demo-voter.json
  voter_registered_fingerprints:
    file: ./secrets/registered_fingerprints.txt
