<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="{{ url_for('signin.static', filename='login.css') }}">
  <script src="{{ url_for('signin.static', filename='login.js') }}" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Electronic Voting Platform · Academic prototype</p>
    <h1>Sign in to vote</h1>
    <p>Use your account, your password and the 6-digit code from your authenticator app.</p>
    <form id="signin-form" autocomplete="off">
      <label for="account_id">Account</label>
      <input id="account_id" name="account_id" type="text" required maxlength="64" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">

      <label for="totp_code">6-digit code</label>
      <input id="totp_code" name="totp_code" type="text" inputmode="numeric" pattern="[0-9]{6}" required maxlength="6" autocomplete="one-time-code">

      <p id="signin-error" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>
    <noscript>JavaScript is required to sign in.</noscript>
  </main>
</body>
</html>
