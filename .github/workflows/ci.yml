# SR-20: Continuous testing, dependency scanning and SBOM.
# Runs every security test, checks third-party packages
# against public vulnerability data and records an SBOM.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0

      - name: Run security and unit tests
        run: python -m pytest -q

      - name: Scan dependencies for known vulnerabilities (SR-20)
        run: pip-audit -r requirements.txt

      - name: Generate SBOM (SR-20)
        run: cyclonedx-py requirements requirements.txt -o sbom.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
